<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تصميم الابتسامة | عيادة المالكي لطب الأسنان</title>
  <meta name="description" content="تعرف على تصميم الابتسامة في عيادة المالكي لطب الأسنان بالعجمي، الإسكندرية، والأسئلة الشائعة.">
  <link rel="icon" href="images/logo-icon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body data-service="smile-makeover">
  <main>
    <section class="page-hero">
      <div class="container">
      <h1>تصميم الابتسامة</h1>
        <p><a href="services.html" style="text-decoration: underline;">← كل الخدمات</a></p>
      </div>
    </section>

    <div id="service-content">
      <section class="section">
        <div class="container prose">
          <p class="dev-notice" id="dev-notice" hidden>
            مسودة: النص الطبي لهذه الخدمة يحتاج مراجعة الدكتور (تظهر هذه الملاحظة على جهازك فقط).
          </p>
          <h2>نبذة عن الخدمة</h2>
          <p id="service-description"></p>
        </div>
      </section>

      <section class="section section--alt">
        <div class="container prose">
          <h2>ماذا تقدم لك هذه الخدمة؟</h2>
          <ul class="check-list" id="service-benefits"></ul>
        </div>
      </section>

      <section class="section">
        <div class="container prose">
          <h2>مراحل العلاج</h2>
          <ol class="steps-list" id="service-steps"></ol>
        </div>
      </section>

      <section class="section section--alt">
        <div class="container prose">
          <h2>أسئلة شائعة</h2>
          <div id="service-faqs"></div>
        </div>
      </section>
    </div>

    <section class="cta-band">
      <div class="container">
        <h2>تريد معرفة المناسب لحالتك؟</h2>
        <p>احجز موعد فحص وسيؤكده لك فريق العيادة.</p>
        <a href="booking.html" class="btn">احجز موعدك</a>
      </div>
    </section>
  </main>

  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/service-detail.js"></script>

</html>
