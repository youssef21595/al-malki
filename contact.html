<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تواصل معنا | عيادة المالكي لطب الأسنان</title>
  <meta name="description" content="عنوان عيادة المالكي لطب الأسنان في العجمي بالإسكندرية، مواعيد العمل، رقم التليفون والواتساب، والخريطة.">
  <link rel="icon" href="images/logo-icon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>
  <main>
    <section class="page-hero">
      <div class="container">
        <h1>تواصل معنا</h1>
        <p>يسعدنا استقبال اتصالك أو رسالتك.</p>
      </div>
    </section>

    <section class="section">
      <div class="container contact-grid">
        <div>
          <h2>بيانات العيادة</h2>
          <ul class="info-list" style="margin-top: 1rem;">
            <li>
              <h3>العنوان</h3>
              <p id="clinic-address"></p>
            </li>
            <li>
              <h3>التليفون والواتساب</h3>
              <p id="clinic-phone" dir="ltr" style="text-align: right;"></p>
            </li>
            <li>
              <h3>مواعيد العمل</h3>
              <p>يومياً: <span id="clinic-hours"></span></p>
              <p id="clinic-dayoff"></p>
            </li>
          </ul>

          <div class="action-row">
            <a class="btn" id="call-link" href="#">اتصل الآن</a>
            <a class="btn btn--ghost" id="whatsapp-link" href="#" target="_blank" rel="noopener">واتساب</a>
            <a class="btn btn--ghost" id="directions-link" href="#" target="_blank" rel="noopener">الاتجاهات</a>
          </div>
        </div>

        <div>
          <iframe
            id="map-frame"
            class="map-frame"
            title="موقع عيادة المالكي لطب الأسنان على الخريطة"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
      </div>
    </section>

    <section class="section section--alt">
      <div class="container prose">
        <h2>أرسل لنا رسالة</h2>
        <p>اكتب بياناتك ورسالتك، وسنفتح لك واتساب برسالة جاهزة تضغط إرسال عليها.</p>

        <form id="contact-form" class="form" novalidate style="margin-top: 1.5rem;">
          <div class="form__field">
            <label for="cf-name">الاسم</label>
            <input id="cf-name" name="name" type="text" autocomplete="name" required>
            <p class="form__error" id="cf-name-error" role="alert"></p>
          </div>

          <div class="form__field">
            <label for="cf-phone">رقم الموبايل</label>
            <input id="cf-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" dir="ltr" required>
            <p class="form__error" id="cf-phone-error" role="alert"></p>
          </div>

          <div class="form__field">
            <label for="cf-message">رسالتك</label>
            <textarea id="cf-message" name="message" required></textarea>
            <p class="form__error" id="cf-message-error" role="alert"></p>
          </div>

          <div class="form__field">
            <label class="form__check" for="cf-consent">
              <input id="cf-consent" name="consent" type="checkbox">
              <span>أوافق على <a class="text-link" href="privacy.html">سياسة الخصوصية</a> واستخدام بياناتي للرد على رسالتي.</span>
            </label>
            <p class="form__error" id="cf-consent-error" role="alert"></p>
          </div>

          <button class="btn" type="submit">إرسال عبر واتساب</button>
          <p class="form__status" id="form-status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <script type="module" src="js/layout.js"></script>
  <script type="module" src="js/contact.js"></script>
</body>
</html>
